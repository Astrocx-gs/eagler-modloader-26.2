name: Diagnose TeaVM Version

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Shallow clone Eaglercraft 26.2 workspace
        run: |
          git init -q workspace
          cd workspace
          git remote add origin https://github.com/kingjoeishere/Eaglercraft-26.2-Workspace
          git fetch -q --depth 1 origin f73bff91f0f0840bc958c09ab536dbba1e146b2e
          git checkout -q FETCH_HEAD

      - name: Print TeaVM dependency declarations
        run: |
          echo "=== platform-teavm/build.gradle ==="
          grep -in "teavm" workspace/platform-teavm/build.gradle || true
          echo "=== All teavm mentions in Gradle files ==="
          grep -rn -i "teavm" workspace --include="*.gradle*" --include="*.toml" --include="*.properties" || true
