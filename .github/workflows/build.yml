name: Build Eaglercraft 26.2

# Builds Eaglercraft 26.2 with the Fabric mods in mods/ built in, as one standalone HTML file.
# loader/weave.sh hooks build-time Fabric into the workspace's Gradle build; see the README.
#
# Test builds (every push that changes mods/ or loader/, and manual runs): faster, lighter compression,
# readable names in crash reports, published as a pre-release. Release builds (push a tag like v1.0, or a manual run with "release"
# ticked): maximum compression, published as a normal release.
#
# TeaVM patch caching (round 7): the *pristine* TeaVM jars are cached, never the patched ones. Every run
# unpacks a fresh copy of the source jar, patches that copy, and swaps it in atomically, so a cached
# workspace can never arrive already patched. See the "Prepare pristine TeaVM sources" step.

on:
  push:
    branches: [main]
    paths: ["mods/**", "loader/**", "addons/**", "!flick-build-worker.js", "!flick-standalone.html", "!*.md", "!docs/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release build (maximum compression, published as a normal release)"
        type: boolean
        default: false
      diagnostic:
        description: "Diagnostic build (readable names in crash reports; published as a draft only you can see)"
        type: boolean
        default: false
      mod_urls:
        description: "Comma-separated Modrinth/direct JAR URLs to include in mods/"
        type: string
        default: ""
      cache_key:
        description: "Deterministic SHA-256 combo key for R2 caching"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  # The Eaglercraft 26.2 workspace is downloaded at build time and never committed here.
  WORKSPACE_REPO: https://github.com/kingjoeishere/Eaglercraft-26.2-Workspace
  WORKSPACE_COMMIT: f73bff91f0f0840bc958c09ab536dbba1e146b2e
  # The TeaVM jars the patcher edits, and the scratch dir the patching steps share.
  EML_TEAVM_DIR: wasm-toolchain/teavm-eagler-patch
  EML_TEAVM_JAR: wasm-toolchain/teavm-eagler-patch/teavm-core-0.13.1-eagler.jar

jobs:
  build:
    runs-on: ubuntu-latest   # public repos: 4 cores, 16 GB RAM
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Download requested Fabric JARs
        if: ${{ inputs.mod_urls != '' }}
        run: |
          IFS=',' read -ra URLS <<< "${{ inputs.mod_urls }}"
          for u in "${URLS[@]}"; do
            [ -n "$u" ] && curl -fSL --retry 3 -o "mods/$(basename "$u")" "$u"
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      # Gradle dependency caching is preserved exactly as before.
      - name: Cache Gradle & Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            workspace/.gradle
          key: gradle-26.2-${{ env.WORKSPACE_COMMIT }}-${{ hashFiles('loader/**') }}
          restore-keys: |
            gradle-26.2-${{ env.WORKSPACE_COMMIT }}-

      # CHANGED: the workspace is no longer cached. It is a shallow git clone (seconds), and every
      # run used to inherit whatever TeaVM jars the previous run had patched in place. Only the
      # *pristine* TeaVM jars are cached now, below.
      - name: Download the Eaglercraft 26.2 workspace
        run: |
          git init -q workspace
          cd workspace
          git remote add origin "$WORKSPACE_REPO"
          git fetch -q --depth 1 origin "$WORKSPACE_COMMIT"
          git checkout -q FETCH_HEAD
          chmod +x gradlew
          # Gradle itself is downloaded on first use; retry, since that download sometimes times out
          for i in 1 2 3 4 5; do ./gradlew --no-daemon --version >/dev/null && break; echo "Gradle download failed (try $i), retrying"; sleep $((i * 20)); done

      # CHANGED: cache the unmodified TeaVM jars, keyed by the workspace commit, added on the first run.
      # Keyed per source jar, so bumping TeaVM in the workspace simply misses and refreshes the cache.
      - name: Cache pristine TeaVM sources
        id: cache-teavm
        uses: actions/cache@v4
        with:
          path: |
            teavm-pristine/teavm-core-0.13.1-eagler.jar
            teavm-pristine/classlib-override.jar
            teavm-pristine/teavm-classlib-0.13.1.jar
          key: teavm-pristine-${{ env.WORKSPACE_COMMIT }}-${{ hashFiles('workspace/wasm-toolchain/teavm-eagler-patch/*.jar') }}

      # Materialise the pristine copies. `git checkout` above already restored unmodified files into
      # workspace/, so on a cache miss we simply copy from there; on a hit the cached copies are used.
      # Either way the jars are verified to load before anything patches them.
      - name: Prepare pristine TeaVM sources
        run: |
          set -euo pipefail
          mkdir -p teavm-pristine eml/deps
          for j in teavm-core-0.13.1-eagler.jar classlib-override.jar; do
            if [ ! -s "teavm-pristine/$j" ]; then
              cp -f "workspace/$EML_TEAVM_DIR/$j" "teavm-pristine/$j"
            fi
            test -s "teavm-pristine/$j"
            jar tf "teavm-pristine/$j" > /dev/null    # a truncated cache entry fails here, loudly
            echo "[pristine] $j $(sha256sum "teavm-pristine/$j" | awk '{print $1}')"
          done
          echo "[pristine] done; patcher dependencies come from loader/weave.sh below"

      - name: Diagnose workspace Gui.java
        id: diag_gui
        run: |
          set -euo pipefail
          TARGET="workspace/game/src/main/java/net/minecraft/client/gui/Gui.java"
          if [ ! -f "$TARGET" ]; then
            echo "[Diag] ERROR: Expected $TARGET not found"
            find workspace -name "Gui.java" -print
            exit 1
          fi
          echo "[Diag] Gradle modules (settings.gradle):"
          if [ -f workspace/settings.gradle ]; then
            grep -E "include|project" workspace/settings.gradle
          else
            echo "[Diag] no workspace/settings.gradle"
          fi
          echo "[Diag] Selected: $TARGET"
          if markers=$(grep -n "package \|class Gui\|void render(" "$TARGET" | head -n 15); then
            printf '%s\n' "$markers"
          else
            echo "[Diag] no package/class Gui/render( markers in $TARGET"
          fi
          echo "gui_file=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Download the mods listed in mods/modrinth.txt
        run: |
          if [ -f mods/modrinth.txt ]; then python3 tools/modrinth.py download 26.2 mods/modrinth.txt mods; fi
          ls mods

      # Quick checks first, so a mod that can't work stops the build in minutes instead of after the
      # long browser compile.
      - name: "Check the mods: can each jar be built in? (seconds)"
        run: |
          mkdir -p eml
          python3 loader/scan-mods.py mods eml/mod-check.md workspace || { cat eml/mod-check.md >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          cat eml/mod-check.md >> "$GITHUB_STEP_SUMMARY"

      - name: Set up build-time Fabric
        run: chmod +x loader/weave.sh && loader/weave.sh workspace eml

      - name: "Check the mods: apply them to the game (a few minutes)"
        working-directory: workspace
        run: ./gradlew --no-daemon --console=plain :game:compileJava

      - name: Print eml/weave.log on failure
        if: failure()
        run: |
          if [ -f eml/weave.log ]; then
            echo "=== eml/weave.log ==="
            cat eml/weave.log
          elif [ -f ../eml/weave.log ]; then
            echo "=== ../eml/weave.log ==="
            cat ../eml/weave.log
          else
            echo "eml/weave.log not found"
          fi

      - name: Explain a failed mod check
        if: failure()
        run: |
          {
            echo "## Why the build stopped"; echo
            if [ -f eml/weave.log ]; then
              echo "Applying the mods to the game failed. The important part of the log:"; echo; echo '```'
              grep -E "Incompatible|requires|Mod resolution|Unhandled|Caused by|Exception|ERROR|error:" eml/weave.log | head -40
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space and add swap
        run: |
          # best-effort housekeeping on the runner, but reported either way rather than silenced
          if sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; then
            echo "[disk] removed unused toolchains"
          else
            echo "[disk] nothing to remove (non-fatal)"
          fi
          if sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2; then
            echo "[disk] 8G swap enabled"
          else
            echo "[disk] swap not added (non-fatal)"
          fi
          free -h; df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Game sounds from Mojang (not in the workspace)
        run: |
          python3 loader/fetch-sounds.py 26.2 eml/sounds eml/music
          cd workspace
          mkdir -p target_teavm/build/web
          # the workspace's own EPK packager, run the way its assets.epk task runs it (desktop platform)
          cat > ../eml/epk.init.gradle <<'EOF2'
          allprojects {
            afterEvaluate { p ->
              if (p.path != ":target_lwjgl_desktop") return
              ["sounds", "music"].each { n ->
                p.tasks.register("emlPack_" + n, JavaExec) {
                  classpath = p.sourceSets.main.runtimeClasspath
                  mainClass = "net.lax1dude.eaglercraft.v1_8.sp.server.export.EPKPackagerMain"
                  args(new File(p.rootDir, "../eml/" + n).absolutePath,
                       new File(p.rootDir, "target_teavm/build/web/" + n + ".epk").absolutePath,
                       n + ".epk", "--include-web-unreachable")
                }
              }
            }
          }
          EOF2
          ./gradlew --no-daemon --console=plain -I ../eml/epk.init.gradle :target_lwjgl_desktop:emlPack_sounds :target_lwjgl_desktop:emlPack_music
          ls -la target_teavm/build/web/

      # CHANGED: was a javac + java against a scratch /tmp dir with no eml/deps, so it could only ever
      # report "DEPS is empty" or "FileNotFound". It now unpacks the jar into a scratch dir and drives
      # the patcher the way the real step does, on *copies*, with the patcher's exit code as the verdict.
      - name: Verify PatchTeaVM idempotency on ReferenceResolver
        env:
          EML_DEPS: ${{ github.workspace }}/eml/deps
        run: |
          set -euo pipefail
          if ! ls "$EML_DEPS"/*.jar >/dev/null 2>&1; then
            echo "ERROR: $EML_DEPS is empty, so PatchTeaVM.java cannot be compiled."
            echo "       loader/weave.sh is supposed to populate it; check eml/weave.log."
            if [ -f loader/fetch-deps.py ]; then
              echo "[deps] falling back to loader/fetch-deps.py"
              python3 loader/fetch-deps.py eml/deps
            fi
            ls "$EML_DEPS"/*.jar >/dev/null 2>&1 || { echo "ERROR: still no jars in $EML_DEPS"; exit 1; }
          fi
          DEPS="$(ls "$EML_DEPS"/*.jar | tr '\n' ':')"
          JAR="$GITHUB_WORKSPACE/teavm-pristine/teavm-core-0.13.1-eagler.jar"
          test -s "$JAR"
          WORK="$RUNNER_TEMP/patch-idempotency"
          rm -rf "$WORK"; mkdir -p "$WORK/classes" "$WORK/x"; cd "$WORK"
          javac -nowarn -cp "$DEPS" -d classes "$GITHUB_WORKSPACE/loader/tools/PatchTeaVM.java"

          # work from a copy: the cached pristine jar must never be mutated by a test
          cp -f "$JAR" RR.jar
          (cd x && unzip -o -q ../RR.jar org/teavm/dependency/ReferenceResolver.class)

          echo "=== Before Run 1 (javap reportError) ==="
          javap -p -c x/org/teavm/dependency/ReferenceResolver.class | grep -A 25 "reportError"
          echo "=== Run 1 (unpatched -> patched) ==="
          java -cp "$DEPS:classes" PatchTeaVM x/org/teavm/dependency/ReferenceResolver.class
          echo "=== After Run 1 (verify Diagnostics.warning) ==="
          javap -p -c x/org/teavm/dependency/ReferenceResolver.class | grep -A 25 "reportError" | grep -F "org/teavm/diagnostics/Diagnostics.warning"
          cp x/org/teavm/dependency/ReferenceResolver.class ReferenceResolver.class.after1

          echo "=== Run 2 (already patched -> must be a no-op) ==="
          java -cp "$DEPS:classes" PatchTeaVM x/org/teavm/dependency/ReferenceResolver.class
          cmp x/org/teavm/dependency/ReferenceResolver.class ReferenceResolver.class.after1
          echo "[PatchTeaVM] idempotency, Diagnostics.warning and byte-identity verified."

      # CHANGED: single ownership of patching. This step writes only to fresh copies in a scratch dir,
      # then swaps the finished jars in. Previously this step edited the workspace jars in place with
      # `jar uf` + `mv`, which is what made a cached workspace arrive already patched.
      - name: Patch TeaVM for mods (null checks, missing classes, reflection, Files.createDirectories, UTF8)
        env:
          EML_DEPS: ${{ github.workspace }}/eml/deps
        run: |
          set -euo pipefail
          if ! ls "$EML_DEPS"/*.jar >/dev/null 2>&1; then
            echo "ERROR: $EML_DEPS is empty, so PatchTeaVM.java cannot be compiled."
            echo "       loader/weave.sh is supposed to populate it; check eml/weave.log."
            exit 1
          fi
          DEPS="$(ls "$EML_DEPS"/*.jar | tr '\n' ':')"
          PRISTINE="$GITHUB_WORKSPACE/teavm-pristine"
          JARDIR="$GITHUB_WORKSPACE/workspace/$EML_TEAVM_DIR"
          WORK="$RUNNER_TEMP/patch-teavm"
          rm -rf "$WORK"; mkdir -p "$WORK/classes" "$WORK/x"; cd "$WORK"

          # --- 1. the patcher itself
          javac -nowarn -cp "$DEPS" -d classes "$GITHUB_WORKSPACE/loader/tools/PatchTeaVM.java"

          # --- 2. patch a COPY of the pristine core jar
          cp -f "$PRISTINE/teavm-core-0.13.1-eagler.jar" core.jar
          CLS="org/teavm/model/transformation/NullCheckInsertion.class org/teavm/vm/TeaVM.class org/teavm/dependency/ReferenceResolver.class"
          (cd x && unzip -o -q ../core.jar $CLS)
          java -cp "$DEPS:classes" PatchTeaVM $CLS
          jar uf core.jar $CLS
          # fail here, not three steps later: exactly one entry each, wrapper present
          jar tf core.jar > list.txt
          for c in $CLS; do
            [ "$(grep -c -E "^${c//\//\\/}\$" list.txt)" -eq 1 ] || {
              echo "ERROR: expected exactly one $c in core.jar"; grep -F "${c%.class}" list.txt; exit 1; }
          done
          [ "$(javap -cp core.jar -p -s org.teavm.vm.TeaVM | grep -c 'optimizeMethodCacheMiss\$orig(')" -eq 1 ]
          [ "$(javap -cp core.jar -p -s org.teavm.vm.TeaVM | grep -c 'optimizeMethodCacheMiss(')" -eq 1 ]
          [ "$(javap -cp core.jar -p -s org.teavm.model.transformation.NullCheckInsertion | grep -c 'transformProgram\$orig(')" -eq 1 ]
          [ "$(javap -cp core.jar -p -s org.teavm.model.transformation.NullCheckInsertion | grep -c 'transformProgram(')" -eq 1 ]
          javap -cp core.jar -p -c org.teavm.dependency.ReferenceResolver | grep -q 'org/teavm/diagnostics/Diagnostics.warning'

          # --- 3. TeaVM's classlib (reflection, Files, Charset)
          curl -fsSL --retry 5 -o teavm-classlib.jar https://repo1.maven.org/maven2/org/teavm/teavm-classlib/0.13.1/teavm-classlib-0.13.1.jar
          CL="org/teavm/classlib/java/lang/reflect/TConstructor.class org/teavm/classlib/java/lang/reflect/TMethod.class org/teavm/classlib/java/nio/file/TFiles.class org/teavm/classlib/java/nio/charset/TCharset.class"
          (cd x && unzip -o -q ../teavm-classlib.jar $CL)
          java -cp "$DEPS:classes" PatchTeaVM $CL

          # --- 4. build the override jar from the pristine one plus the patched entries
          cp -f "$PRISTINE/classlib-override.jar" override.jar
          jar uf override.jar $CL
          if [ -f "$GITHUB_WORKSPACE/loader/teavm-compat/java/java/security/DigestInputStream.java" ]; then
            javac -nowarn --patch-module java.base="$GITHUB_WORKSPACE/loader/teavm-compat/java" -d classes \
              "$GITHUB_WORKSPACE/loader/teavm-compat/java/java/security/DigestInputStream.java"
            jar uf override.jar -C classes java/security/DigestInputStream.class
            echo "[patch-teavm] DigestInputStream.class added to classlib-override.jar"
          fi

          # --- 5. publish atomically into the workspace, after the private verification below
          echo "core.jar $(sha256sum core.jar | awk '{print $1}')" > "$WORK/SHA256SUMS"
          echo "override.jar $(sha256sum override.jar | awk '{print $1}')" >> "$WORK/SHA256SUMS"

          # the runtime check needs the tool classpath, so it happens in its own step; copy the
          # finished jars there and let that step do the swap.
          mkdir -p "$GITHUB_WORKSPACE/eml/patched"
          cp -f core.jar override.jar "$WORK/SHA256SUMS" "$GITHUB_WORKSPACE/eml/patched/"
          echo "[patch-teavm] staged in eml/patched; the verify step installs them."

      - name: Pre-link sanity check
        run: |
          set -uo pipefail
          echo "[Pre-link] Starting sanity checks..."
          FAIL=0
          for f in \
            "workspace/wasm-toolchain/build-single-html.js" \
            "eml/patched/teavm-core-0.13.1-eagler.jar" \
            "eml/patched/classlib-override.jar"; do
            if [ -f "$f" ]; then
              echo "[Pre-link] PASS: $f exists"
            else
              echo "[Pre-link] FAIL: missing $f"
              FAIL=1
            fi
          done
          if [ -f loader/teavm-compat/java/java/security/DigestInputStream.java ]; then
            if jar tf eml/patched/classlib-override.jar | grep -F -x "java/security/DigestInputStream.class" >/dev/null; then
              echo "[Pre-link] PASS: DigestInputStream.class in classlib-override.jar"
            else
              echo "[Pre-link] FAIL: DigestInputStream.class missing from classlib-override.jar"
              FAIL=1
            fi
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "[Pre-link] FAILED."
            exit 1
          fi
          echo "[Pre-link] COMPLETED: All checks passed."

      # CHANGED: verifies the staged jars, then installs them into the workspace. The runtime classpath
      # check runs BEFORE the swap, so a jar that fails verification never reaches the build.
      - name: Verify patched TeaVM JAR and runtime classpath
        env:
          PUBLISH: "1"
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/eml/patched/teavm-core-0.13.1-eagler.jar"
          test -s "$JAR"
          test -s "$GITHUB_WORKSPACE/eml/patched/classlib-override.jar"
          ZIP_COUNT="$(jar tf "$JAR" | grep -c '^org/teavm/vm/TeaVM\.class$')"
          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "[Verify-TeaVM] FAIL: expected 1 ZIP entry for org/teavm/vm/TeaVM.class, found $ZIP_COUNT"
            exit 1
          fi
          echo "[Verify-TeaVM] PASS: 1 ZIP entry for org/teavm/vm/TeaVM.class"

          ORIG_COUNT="$(javap -cp "$JAR" -p -s org.teavm.vm.TeaVM | awk '/optimizeMethodCacheMiss\$orig\(/{n++} END{print n+0}')"
          WRAP_COUNT="$(javap -cp "$JAR" -p -s org.teavm.vm.TeaVM | awk '/optimizeMethodCacheMiss\(/{n++} END{print n+0}')"
          if [ "$ORIG_COUNT" -ne 1 ] || [ "$WRAP_COUNT" -ne 1 ]; then
            echo "[Verify-TeaVM] FAIL: expected optimizeMethodCacheMiss\$orig=1 and =1, got orig=$ORIG_COUNT wrap=$WRAP_COUNT"
            exit 1
          fi
          echo "[Verify-TeaVM] PASS: optimizeMethodCacheMiss=1, optimizeMethodCacheMiss\$orig=1"

          mkdir -p "$RUNNER_TEMP/teavm-rt-check"
          unzip -p "$JAR" org/teavm/vm/TeaVM.class > "$RUNNER_TEMP/teavm-rt-check/expected-TeaVM.class"
          EXPECTED_SHA="$(sha256sum "$RUNNER_TEMP/teavm-rt-check/expected-TeaVM.class" | awk '{print $1}')"
          echo "[Verify-TeaVM] Expected TeaVM.class SHA-256: $EXPECTED_SHA"

          TOOL_CP="$(cd workspace && ./gradlew --no-daemon -q :target_teavm_wasm_gc:printStandaloneClasspaths | node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            console.log(data.tool.join(":"));
          ')"

          cat << 'EOF' > "$RUNNER_TEMP/teavm-rt-check/CheckTeaVMRuntime.java"
          import java.io.InputStream;
          import java.net.URL;
          import java.security.MessageDigest;

          public class CheckTeaVMRuntime {
            public static void main(String[] args) throws Exception {
              String expectedSha = args[0];
              URL res = CheckTeaVMRuntime.class.getClassLoader().getResource("org/teavm/vm/TeaVM.class");
              System.out.println("[Verify-TeaVM] Runtime resource URL: " + res);
              if (res == null) throw new IllegalStateException("org/teavm/vm/TeaVM.class not found on tool classpath");
              byte[] bytes;
              try (InputStream in = res.openStream()) {
                bytes = in.readAllBytes();
              }
              MessageDigest md = MessageDigest.getInstance("SHA-256");
              byte[] digest = md.digest(bytes);
              StringBuilder sb = new StringBuilder();
              for (byte b : digest) sb.append(String.format("%02x", b));
              String actualSha = sb.toString();
              System.out.println("[Verify-TeaVM] Runtime TeaVM.class SHA-256: " + actualSha);
              if (!expectedSha.equals(actualSha)) {
                throw new IllegalStateException("Runtime TeaVM.class SHA-256 mismatch! expected=" + expectedSha + " actual=" + actualSha);
              }
              Class<?> cls = Class.forName("org.teavm.vm.TeaVM");
              System.out.println("[Verify-TeaVM] PASS: Loaded & verified " + cls.getName() + " (" + cls.getDeclaredMethods().length + " methods)");
            }
          }
          EOF
          javac -d "$RUNNER_TEMP/teavm-rt-check" "$RUNNER_TEMP/teavm-rt-check/CheckTeaVMRuntime.java"
          java -Xverify:all -cp "$RUNNER_TEMP/teavm-rt-check:$TOOL_CP" CheckTeaVMRuntime "$EXPECTED_SHA"

          # install only after every check above passed, and atomically, so an interrupted run can
          # never leave a half-written jar in the workspace
          DEST="$GITHUB_WORKSPACE/workspace/$EML_TEAVM_DIR"
          cp -f "$JAR" "$DEST/teavm-core-0.13.1-eagler.jar.new"
          cp -f "$GITHUB_WORKSPACE/eml/patched/classlib-override.jar" "$DEST/classlib-override.jar.new"
          mv -f "$DEST/teavm-core-0.13.1-eagler.jar.new" "$DEST/teavm-core-0.13.1-eagler.jar"
          mv -f "$DEST/classlib-override.jar.new" "$DEST/classlib-override.jar"
          echo "[Verify-TeaVM] installed patched jars into $DEST"
          sha256sum "$DEST/teavm-core-0.13.1-eagler.jar" "$DEST/classlib-override.jar"

      # Same contract as the original: it must patch an already-patched class as a no-op. Run last,
      # against the installed jars, so it cannot be mistaken for the thing that patches them.
      - name: Assert PatchTeaVM is idempotent on the installed jars
        env:
          EML_DEPS: ${{ github.workspace }}/eml/deps
        run: |
          set -euo pipefail
          ls "$EML_DEPS"/*.jar >/dev/null 2>&1 || { echo "ERROR: $EML_DEPS is empty"; exit 1; }
          DEPS="$(ls "$EML_DEPS"/*.jar | tr '\n' ':')"
          WORK="$RUNNER_TEMP/patch-idem-installed"; rm -rf "$WORK"; mkdir -p "$WORK/classes" "$WORK/x"; cd "$WORK"
          javac -nowarn -cp "$DEPS" -d classes "$GITHUB_WORKSPACE/loader/tools/PatchTeaVM.java"
          (cd x && unzip -o -q "$GITHUB_WORKSPACE/workspace/$EML_TEAVM_JAR" \
            org/teavm/dependency/ReferenceResolver.class org/teavm/vm/TeaVM.class \
            org/teavm/model/transformation/NullCheckInsertion.class)
          cp x/org/teavm/dependency/ReferenceResolver.class before.class
          java -cp "$DEPS:classes" PatchTeaVM \
            x/org/teavm/dependency/ReferenceResolver.class \
            x/org/teavm/vm/TeaVM.class \
            x/org/teavm/model/transformation/NullCheckInsertion.class
          cmp x/org/teavm/dependency/ReferenceResolver.class before.class
          echo "[PatchTeaVM] re-patching the installed jars changed nothing."

      - name: Integrate FlickBridge into Gui.render
        run: |
          set -euo pipefail
          if ! grep -q "teavm-jso" workspace/teavm-compat/build.gradle.kts; then
            sed -i 's/compileOnly("org.teavm:teavm-core:0.13.0")/compileOnly("org.teavm:teavm-core:0.13.0")\n\tcompileOnly("org.teavm:teavm-jso:0.13.0")/' workspace/teavm-compat/build.gradle.kts
          fi
          mkdir -p workspace/game/src/main/java/net/flick/bridge
          cp -f loader/teavm-compat/java/net/flick/bridge/FlickBridge.java workspace/game/src/main/java/net/flick/bridge/FlickBridge.java
          GUI_FILE="${{ steps.diag_gui.outputs.gui_file }}"
          if [ -z "$GUI_FILE" ] || [ ! -f "$GUI_FILE" ]; then
            echo "[FlickBridge] ERROR: Validated Gui.java not found at: $GUI_FILE"
            exit 1
          fi
          python3 - "$GUI_FILE" << 'PY'
          import sys, re
          path = sys.argv[1]
          src = open(path, "r", encoding="utf-8").read()
          if "FlickBridge.dispatchHud" in src:
              print("[FlickBridge] Already integrated in", path)
              sys.exit(0)
          m = re.search(r"(this\.hud\.extractRenderState\((\w+),\s*\w+\);)", src)
          if not m:
              print("[FlickBridge] ERROR: this.hud.extractRenderState(...) not found in", path)
              sys.exit(1)
          gfx = m.group(2)
          hook = (
              "\n        net.flick.bridge.FlickBridge.initRegistry();\n"
              "        if (this.minecraft != null && this.minecraft.player != null) {\n"
              "            StringBuilder _ab = new StringBuilder(\"[\");\n"
              "            net.minecraft.world.entity.EquipmentSlot[] _slots = { net.minecraft.world.entity.EquipmentSlot.FEET, net.minecraft.world.entity.EquipmentSlot.LEGS, net.minecraft.world.entity.EquipmentSlot.CHEST, net.minecraft.world.entity.EquipmentSlot.HEAD };\n"
              "            for (int _i = 0; _i < _slots.length; _i++) {\n"
              "                var _st = this.minecraft.player.getItemBySlot(_slots[_i]);\n"
              "                if (_i > 0) _ab.append(',');\n"
              "                _ab.append(\"{\\\"item\\\":\\\"\").append(_st.isEmpty() ? \"\" : String.valueOf(_st.getItem())).append(\"\\\",\\\"durability\\\":\").append(_st.getMaxDamage() - _st.getDamageValue()).append(\",\\\"maxDurability\\\":\").append(Math.max(1, _st.getMaxDamage())).append('}');\n"
              "            }\n"
              "            _ab.append(']');\n"
              "            String _cmds = net.flick.bridge.FlickBridge.dispatchHud(_ab.toString());\n"
              "            if (_cmds != null && !_cmds.isEmpty()) {\n"
              "                for (String _line : _cmds.split(\"\\n\")) {\n"
              "                    String[] _p = _line.split(\"(?<!\\\\\\\\)\\\\|\", -1);\n"
              "                    if (_p.length >= 4 && \"T\".equals(_p[0])) {\n"
              "                        int _x = Integer.parseInt(_p[2]), _y = Integer.parseInt(_p[3]);\n"
              "                        int _col = _p.length >= 5 && _p[4].startsWith(\"#\") ? (0xFF000000 | Integer.parseInt(_p[4].substring(1), 16)) : 0xFFFFFFFF;\n"
              "                        String _txt = _p[1].replace(\"\\\\n\", \"\\n\").replace(\"\\\\r\", \"\\r\").replace(\"\\\\|\", \"|\").replace(\"\\\\\\\\\", \"\\\\\");\n"
              f"                        {gfx}.text(this.minecraft.font, _txt, _x, _y, _col);\n"
              "                    }\n"
              "                }\n"
              "            }\n"
              "        }\n"
          )
          src = src[:m.end()] + hook + src[m.end():]
          open(path, "w", encoding="utf-8").write(src)
          print("[FlickBridge] Integrated into", path)
          PY

      - name: Compile :game after FlickBridge integration
        run: |
          set -euo pipefail
          GUI_FILE="${{ steps.diag_gui.outputs.gui_file }}"
          grep -q "EquipmentSlot.FEET" "$GUI_FILE"
          grep -q "\.text(this\.minecraft\.font" "$GUI_FILE"
          ! grep -q "getInventory()\.armor" "$GUI_FILE"
          ! grep -q "\.drawString(" "$GUI_FILE"
          [ "$(grep -c "FlickBridge.dispatchHud" "$GUI_FILE")" -eq 1 ]
          cd workspace
          ./gradlew :game:compileJava :game:jar --no-daemon
          jar tf game/build/libs/*.jar | grep -q "net/minecraft/client/gui/Gui.class"
          jar tf game/build/libs/*.jar | grep -q "net/flick/bridge/FlickBridge.class"

      - name: Build the standalone HTML
        working-directory: workspace
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
          # test builds keep readable names in crash reports; releases don't
          DIAGNOSTIC: ${{ inputs.diagnostic == true || !(startsWith(github.ref, 'refs/tags/v') || inputs.release == true) }}
          EAGLER_BUILD_CAP_MIB: "13312"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          mkdir -p ../out
          npm install --no-audit --no-fund
          if [ "$RELEASE" = "true" ]; then FAST=""; else FAST="--fast-package"; fi
          if [ "$DIAGNOSTIC" = "true" ]; then
            FAST="$FAST --diagnostic"
            # also keep readable names in the singleplayer server worker's crash reports
            export EAGLER_SERVER_DIAGNOSTIC=1
            # the workspace only installs a named server build for local debugging; install it here too
            sed -i 's/^  if (diagnostic) {$/  if (false) {/' wasm-toolchain/link-server-standalone.js
            grep -q '^  if (false) {$' wasm-toolchain/link-server-standalone.js
          fi
          node wasm-toolchain/build-single-html.js $FAST --output ../out/eaglercraft-26.2-modded.html
          python3 ../loader/inject-addons.py ../addons ../out/eaglercraft-26.2-modded.html
          [ -s ../out/eaglercraft-26.2-modded.html ] || { echo "ERROR: final HTML missing or empty"; exit 1; }
          if [ -f ../eml/disabled-injectors.txt ]; then
            awk '!/^#/' ../eml/disabled-injectors.txt > ../out/turned-off-injectors.txt
          else
            echo "[injectors] no eml/disabled-injectors.txt (nothing was turned off)"
            : > ../out/turned-off-injectors.txt
          fi

      - name: Capture TeaVM linker diagnostic on failure
        if: failure()
        run: |
          LOG="workspace/wasm-toolchain/generated/client-precise-link.log"
          if [ -f "$LOG" ]; then
            echo "=== Last 180 lines of $LOG ==="
            tail -n 180 "$LOG"
            echo "=== Fatal errors / Exceptions / Caused by ==="
            if hits=$(grep -n -C 8 -E "ERROR|Exception|AssertionError|ClassCastException|Caused by:" "$LOG" | tail -n 120); then
              printf '%s\n' "$hits"
            else
              echo "(no ERROR/Exception lines in the log)"
            fi
          else
            echo "Diagnostic log not found at $LOG"
          fi

      - name: Upload client-precise-link.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-precise-link-log
          path: workspace/wasm-toolchain/generated/client-precise-link.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-modded
          path: |
            out/
            eml/weave.log
            eml/gen.log
          retention-days: 14

      - name: Publish
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
          DIAGNOSTIC: ${{ inputs.diagnostic == true }}
        run: |
          if [ "$DIAGNOSTIC" = "true" ]; then
            tag="diag-${GITHUB_RUN_NUMBER}"; title="Diagnostic build ${GITHUB_RUN_NUMBER}"; kind=(--draft)
          elif [ "$RELEASE" = "true" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF_NAME}"; else tag="release-${GITHUB_RUN_NUMBER}"; fi
            title="$tag"; kind=(--latest)
          else
            tag="test-${GITHUB_RUN_NUMBER}"; title="Test build ${GITHUB_RUN_NUMBER}"; kind=(--prerelease)
          fi
          {
            if [ "$RELEASE" != "true" ]; then echo "Test build: lighter compression, so the file is a bit larger."; echo; fi
            echo "Eaglercraft 26.2 with these Fabric mods built in (from ${GITHUB_SHA::7}):"
            echo; ls mods | grep '\.jar$' | sed 's/^/- /'
            if ls addons/*.js >/dev/null 2>&1; then echo; echo "Add-ons:"; echo; ls addons/*.js | xargs -n1 basename | sed 's/^/- /'; fi
            if [ -s eml/mod-check.md ]; then echo; sed 's/^## Mod check$/### Mod check/' eml/mod-check.md; fi
            if [ -s out/turned-off-injectors.txt ]; then
              echo; echo "These mod injections don't fit Eaglercraft's version of the game and were turned off:"
              echo; sed 's/^/- /' out/turned-off-injectors.txt
            fi
          } > notes.md
          gh release create "$tag" out/*.html --title "$title" --notes-file notes.md "${kind[@]}"

      - name: Upload successful build as GitHub Actions artifact
        if: ${{ success() && inputs.cache_key != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: flick-${{ inputs.cache_key }}
          path: workspace/build/**/*.html
          if-no-files-found: error
