name: Build Eaglercraft 26.2

# Builds Eaglercraft 26.2 with Fabric mods from mods/ into a standalone HTML file.
# Build-time Fabric integration is applied by loader/weave.sh.

on:
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "loader/**"
      - "addons/**"
      - "!flick-build-worker.js"
      - "!flick-standalone.html"
      - "!*.md"
      - "!docs/**"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release build (maximum compression, published as a normal release)"
        type: boolean
        default: false
      diagnostic:
        description: "Diagnostic build (readable names; published as a draft)"
        type: boolean
        default: false
      mod_urls:
        description: "Comma-separated Modrinth/direct JAR URLs to include in mods/"
        type: string
        default: ""
      cache_key:
        description: "Deterministic SHA-256 combo key for R2 caching"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  WORKSPACE_REPO: https://github.com/kingjoeishere/Eaglercraft-26.2-Workspace
  WORKSPACE_COMMIT: f73bff91f0f0840bc958c09ab536dbba1e146b2e

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-26.2-${{ runner.os }}-${{ env.WORKSPACE_COMMIT }}-${{ hashFiles('loader/**') }}
          restore-keys: |
            gradle-26.2-${{ runner.os }}-${{ env.WORKSPACE_COMMIT }}-

      # Do not cache the workspace itself: it is modified by weaving, patches and compilation.
      # Reusing it can silently carry stale source/classes into a later build.
      - name: Download the pinned Eaglercraft workspace
        run: |
          set -euo pipefail
          git init -q workspace
          git -C workspace remote add origin "$WORKSPACE_REPO"
          git -C workspace fetch -q --depth 1 origin "$WORKSPACE_COMMIT"
          git -C workspace checkout -q FETCH_HEAD
          chmod +x workspace/gradlew
          git -C workspace rev-parse HEAD
          for i in 1 2 3 4 5; do
            if (cd workspace && ./gradlew --no-daemon --version >/dev/null); then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "Gradle wrapper failed after 5 attempts."
              exit 1
            fi
            echo "Gradle download failed (attempt $i); retrying."
            sleep $((i * 20))
          done

      - name: Download requested Fabric JARs
        if: ${{ inputs.mod_urls != '' }}
        env:
          MOD_URLS: ${{ inputs.mod_urls }}
        run: |
          set -euo pipefail
          mkdir -p mods
          IFS=',' read -r -a URLS <<< "$MOD_URLS"
          for u in "${URLS[@]}"; do
            u="${u#"${u%%[![:space:]]*}"}"
            u="${u%"${u##*[![:space:]]}"}"
            [ -n "$u" ] || continue
            name="$(basename "${u%%\?*}")"
            case "$name" in
              *.jar) ;;
              *) echo "Refusing URL without a .jar filename: $u"; exit 1 ;;
            esac
            curl -fSL --retry 3 --retry-all-errors -o "mods/$name" "$u"
          done

      - name: Download mods listed in mods/modrinth.txt
        run: |
          set -euo pipefail
          mkdir -p mods eml
          if [ -f mods/modrinth.txt ]; then
            python3 tools/modrinth.py download 26.2 mods/modrinth.txt mods
          fi
          find mods -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Check that each mod can be built in
        run: |
          set -euo pipefail
          mkdir -p eml
          python3 loader/scan-mods.py mods eml/mod-check.md workspace || {
            [ ! -f eml/mod-check.md ] || cat eml/mod-check.md >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          [ ! -f eml/mod-check.md ] || cat eml/mod-check.md >> "$GITHUB_STEP_SUMMARY"

      - name: Set up build-time Fabric
        run: |
          set -euo pipefail
          chmod +x loader/weave.sh
          loader/weave.sh workspace eml

      # Integrate before compileJava so the modified Gui.java is actually compiled.
      - name: Integrate FlickBridge into Gui.render
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          root = Path("workspace/src/main/java")
          matches = sorted(
              p for p in root.rglob("Gui.java")
              if p.as_posix().endswith("/net/minecraft/client/gui/Gui.java")
          ) if root.is_dir() else []

          if len(matches) != 1:
              print(f"[FlickBridge] ERROR: Expected 1 Gui.java in {root}, found {len(matches)}")
              for p in matches:
                  print(p)
              sys.exit(1)

          path = matches[0]
          src = path.read_text(encoding="utf-8")
          if "FlickBridge.dispatchHud" in src:
              print("[FlickBridge] Already integrated in", path)
              sys.exit(0)

          import re
          pattern = re.compile(
              r"(public\s+void\s+render\s*\(\s*GuiGraphics\s+(\w+)\s*,\s*DeltaTracker\s+\w+\s*\)\s*\{)"
          )
          found = list(pattern.finditer(src))
          if len(found) != 1:
              print(f"[FlickBridge] ERROR: Expected exactly one Gui.render(GuiGraphics, DeltaTracker) method; found {len(found)} in {path}")
              sys.exit(1)

          m = found[0]
          gfx = m.group(2)
          hook = (
              "\n        net.flick.bridge.FlickBridge.initRegistry();\n"
              "        if (this.minecraft != null && this.minecraft.player != null) {\n"
              "            StringBuilder _ab = new StringBuilder(\"[\");\n"
              "            var _arm = this.minecraft.player.getInventory().armor;\n"
              "            for (int _i = 0; _i < _arm.size(); _i++) {\n"
              "                var _st = _arm.get(_i);\n"
              "                if (_i > 0) _ab.append(',');\n"
              "                _ab.append(\"{\\\"item\\\":\\\"\").append(_st.isEmpty() ? \"\" : String.valueOf(_st.getItem())).append(\"\\\",\\\"durability\\\":\").append(_st.getMaxDamage() - _st.getDamageValue()).append(\",\\\"maxDurability\\\":\").append(Math.max(1, _st.getMaxDamage())).append('}');\n"
              "            }\n"
              "            _ab.append(']');\n"
              "            String _cmds = net.flick.bridge.FlickBridge.dispatchHud(_ab.toString());\n"
              "            if (_cmds != null && !_cmds.isEmpty()) {\n"
              "                for (String _line : _cmds.split(\"\\n\")) {\n"
              "                    String[] _p = _line.split(\"(?<!\\\\\\\\)\\\\|\", -1);\n"
              "                    if (_p.length >= 4 && \"T\".equals(_p[0])) {\n"
              "                        int _x = Integer.parseInt(_p[2]), _y = Integer.parseInt(_p[3]);\n"
              "                        int _col = _p.length >= 5 && _p[4].startsWith(\"#\") ? (0xFF000000 | Integer.parseInt(_p[4].substring(1), 16)) : 0xFFFFFFFF;\n"
              "                        String _txt = _p[1].replace(\"\\\\n\", \"\\n\").replace(\"\\\\r\", \"\\r\").replace(\"\\\\|\", \"|\").replace(\"\\\\\\\\\", \"\\\\\");\n"
              f"                        {gfx}.drawString(this.getFont(), _txt, _x, _y, _col);\n"
              "                    }\n"
              "                }\n"
              "            }\n"
              "        }\n"
          )
          updated = src[:m.end()] + hook + src[m.end():]
          path.write_text(updated, encoding="utf-8")
          print("[FlickBridge] Integrated into", path)
          PY

      - name: Compile the modded game sources
        working-directory: workspace
        run: ./gradlew --no-daemon --console=plain :game:compileJava

      - name: Print weave log on failure
        if: failure()
        run: |
          if [ -f eml/weave.log ]; then
            cat eml/weave.log
          else
            echo "eml/weave.log not found"
          fi

      - name: Explain a failed mod check
        if: failure()
        run: |
          {
            echo "## Why the build stopped"
            echo
            if [ -s eml/weave.log ]; then
              echo '```'
              grep -E "Incompatible|requires|Mod resolution|Unhandled|Caused by|Exception|ERROR|error:" eml/weave.log | head -40 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2 || true
          free -h
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Mojang game sounds and package EPK files
        run: |
          set -euo pipefail
          python3 loader/fetch-sounds.py 26.2 eml/sounds eml/music
          cd workspace
          mkdir -p target_teavm/build/web
          cat > ../eml/epk.init.gradle <<'EOF2'
          allprojects {
            afterEvaluate { p ->
              if (p.path != ":target_lwjgl_desktop") return
              ["sounds", "music"].each { n ->
                p.tasks.register("emlPack_" + n, JavaExec) {
                  classpath = p.sourceSets.main.runtimeClasspath
                  mainClass = "net.lax1dude.eaglercraft.v1_8.sp.server.export.EPKPackagerMain"
                  args(new File(p.rootDir, "../eml/" + n).absolutePath,
                       new File(p.rootDir, "target_teavm/build/web/" + n + ".epk").absolutePath,
                       n + ".epk", "--include-web-unreachable")
                }
              }
            }
          }
          EOF2
          ./gradlew --no-daemon --console=plain -I ../eml/epk.init.gradle :target_lwjgl_desktop:emlPack_sounds :target_lwjgl_desktop:emlPack_music
          ls -la target_teavm/build/web/

      - name: Verify PatchTeaVM idempotency on ReferenceResolver
        run: |
          set -euo pipefail
          DEPS="$(find "$GITHUB_WORKSPACE/eml/deps" -maxdepth 1 -type f -name '*.jar' -print | sort | paste -sd: -)"
          [ -n "$DEPS" ] || { echo "No dependency JARs found in eml/deps"; exit 1; }
          JAR="$GITHUB_WORKSPACE/workspace/wasm-toolchain/teavm-eagler-patch/teavm-core-0.13.1-eagler.jar"
          [ -f "$JAR" ] || { echo "Expected TeaVM core JAR missing: $JAR"; exit 1; }
          mkdir -p /tmp/rr-test
          cd /tmp/rr-test
          javac -nowarn -cp "$DEPS" -d . "$GITHUB_WORKSPACE/loader/tools/PatchTeaVM.java"
          unzip -o -q "$JAR" org/teavm/dependency/ReferenceResolver.class
          echo "=== Before Run 1 ==="
          javap -p -c org/teavm/dependency/ReferenceResolver.class | grep -A 25 "reportError" || true
          echo "=== Run 1 ==="
          java -cp "$DEPS:." PatchTeaVM org/teavm/dependency/ReferenceResolver.class
          javap -p -c org/teavm/dependency/ReferenceResolver.class | grep -A 25 "reportError" | grep -F "org/teavm/diagnostics/Diagnostics.warning"
          cp org/teavm/dependency/ReferenceResolver.class ReferenceResolver.class.after1
          echo "=== Run 2 ==="
          java -cp "$DEPS:." PatchTeaVM org/teavm/dependency/ReferenceResolver.class | tee /tmp/rr-run2.log
          grep -F "already patched" /tmp/rr-run2.log >/dev/null
          cmp -s org/teavm/dependency/ReferenceResolver.class ReferenceResolver.class.after1
          jar tf "$JAR" >/dev/null
          echo "[PatchTeaVM] Idempotency and JAR integrity verified."

      - name: Patch TeaVM for mods
        run: |
          set -euo pipefail
          DEPS="$(find "$GITHUB_WORKSPACE/eml/deps" -maxdepth 1 -type f -name '*.jar' -print | sort | paste -sd: -)"
          [ -n "$DEPS" ] || { echo "No dependency JARs found in eml/deps"; exit 1; }
          CORE_JAR="$GITHUB_WORKSPACE/workspace/wasm-toolchain/teavm-eagler-patch/teavm-core-0.13.1-eagler.jar"
          OVERRIDE_JAR="$GITHUB_WORKSPACE/workspace/wasm-toolchain/teavm-eagler-patch/classlib-override.jar"
          [ -f "$CORE_JAR" ] || { echo "Missing $CORE_JAR"; exit 1; }
          [ -f "$OVERRIDE_JAR" ] || { echo "Missing $OVERRIDE_JAR"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/eml/patch-teavm"
          cd "$GITHUB_WORKSPACE/eml/patch-teavm"
          javac -nowarn -cp "$DEPS" -d . "$GITHUB_WORKSPACE/loader/tools/PatchTeaVM.java"
          unzip -o -q "$CORE_JAR" \
            org/teavm/model/transformation/NullCheckInsertion.class \
            org/teavm/vm/TeaVM.class \
            org/teavm/dependency/ReferenceResolver.class
          java -cp "$DEPS:." PatchTeaVM \
            org/teavm/model/transformation/NullCheckInsertion.class \
            org/teavm/vm/TeaVM.class \
            org/teavm/dependency/ReferenceResolver.class
          jar uf "$CORE_JAR" \
            org/teavm/model/transformation/NullCheckInsertion.class \
            org/teavm/vm/TeaVM.class \
            org/teavm/dependency/ReferenceResolver.class

          curl -fsSL --retry 5 --retry-all-errors \
            -o teavm-classlib.jar \
            https://repo1.maven.org/maven2/org/teavm/teavm-classlib/0.13.1/teavm-classlib-0.13.1.jar
          CL=(
            org/teavm/classlib/java/lang/reflect/TConstructor.class
            org/teavm/classlib/java/lang/reflect/TMethod.class
            org/teavm/classlib/java/nio/file/TFiles.class
            org/teavm/classlib/java/nio/charset/TCharset.class
          )
          unzip -o -q teavm-classlib.jar "${CL[@]}"
          java -cp "$DEPS:." PatchTeaVM "${CL[@]}"
          jar uf "$OVERRIDE_JAR" "${CL[@]}"

          if [ -f "$GITHUB_WORKSPACE/loader/teavm-compat/java/java/security/DigestInputStream.java" ]; then
            javac -nowarn --patch-module java.base="$GITHUB_WORKSPACE/loader/teavm-compat/java" \
              -d . "$GITHUB_WORKSPACE/loader/teavm-compat/java/java/security/DigestInputStream.java"
            jar uf "$OVERRIDE_JAR" java/security/DigestInputStream.class
            echo "[patch-teavm] DigestInputStream.class added."
          fi
          echo "[patch-teavm] Completed."

      - name: Pre-link sanity check
        run: |
          set -euo pipefail
          CORE_JAR="workspace/wasm-toolchain/teavm-eagler-patch/teavm-core-0.13.1-eagler.jar"
          OVERRIDE_JAR="workspace/wasm-toolchain/teavm-eagler-patch/classlib-override.jar"
          for f in workspace/wasm-toolchain/build-single-html.js "$CORE_JAR" "$OVERRIDE_JAR"; do
            [ -f "$f" ] || { echo "[Pre-link] FAIL: missing $f"; exit 1; }
            echo "[Pre-link] PASS: $f"
          done
          if [ -f loader/teavm-compat/java/java/security/DigestInputStream.java ]; then
            jar tf "$OVERRIDE_JAR" | grep -F -x "java/security/DigestInputStream.class" >/dev/null
            echo "[Pre-link] PASS: DigestInputStream.class"
          fi
          jar tf "$CORE_JAR" >/dev/null
          jar tf "$OVERRIDE_JAR" >/dev/null
          echo "[Pre-link] Completed."

      - name: Build standalone HTML
        working-directory: workspace
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
          DIAGNOSTIC: ${{ inputs.diagnostic == true || !(startsWith(github.ref, 'refs/tags/v') || inputs.release == true) }}
          EAGLER_BUILD_CAP_MIB: "13312"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          set -euo pipefail
          mkdir -p ../out
          npm install --no-audit --no-fund
          FAST=()
          if [ "$RELEASE" != "true" ]; then FAST+=(--fast-package); fi
          if [ "$DIAGNOSTIC" = "true" ]; then
            FAST+=(--diagnostic)
            export EAGLER_SERVER_DIAGNOSTIC=1
            python3 - <<'PY'
          from pathlib import Path
          p = Path("wasm-toolchain/link-server-standalone.js")
          s = p.read_text()
          old = "  if (diagnostic) {"
          if s.count(old) != 1:
              raise SystemExit(f"Expected exactly one diagnostic conditional in {p}; found {s.count(old)}")
          p.write_text(s.replace(old, "  if (false) {", 1))
          PY
          fi
          node wasm-toolchain/build-single-html.js "${FAST[@]}" --output ../out/eaglercraft-26.2-modded.html
          python3 ../loader/inject-addons.py ../addons ../out/eaglercraft-26.2-modded.html
          test -s ../out/eaglercraft-26.2-modded.html
          grep -v '^#' ../eml/disabled-injectors.txt > ../out/turned-off-injectors.txt 2>/dev/null || true
          ls -lh ../out/

      - name: Capture TeaVM linker diagnostic on failure
        if: failure()
        run: |
          LOG="workspace/wasm-toolchain/generated/client-precise-link.log"
          if [ -f "$LOG" ]; then
            tail -n 180 "$LOG"
            grep -n -C 8 -E "ERROR|Exception|AssertionError|ClassCastException|Caused by:" "$LOG" | tail -n 120 || true
          else
            echo "Diagnostic log not found at $LOG"
          fi

      - name: Upload client linker diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-precise-link-log
          path: workspace/wasm-toolchain/generated/client-precise-link.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload standalone build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-modded
          path: |
            out/eaglercraft-26.2-modded.html
            out/turned-off-injectors.txt
            eml/weave.log
            eml/gen.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
          DIAGNOSTIC: ${{ inputs.diagnostic == true }}
        run: |
          set -euo pipefail
          if [ "$DIAGNOSTIC" = "true" ]; then
            tag="diag-${GITHUB_RUN_NUMBER}"
            title="Diagnostic build ${GITHUB_RUN_NUMBER}"
            kind=(--draft)
          elif [ "$RELEASE" = "true" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              tag="${GITHUB_REF_NAME}"
            else
              tag="release-${GITHUB_RUN_NUMBER}"
            fi
            title="$tag"
            kind=(--latest)
          else
            tag="test-${GITHUB_RUN_NUMBER}"
            title="Test build ${GITHUB_RUN_NUMBER}"
            kind=(--prerelease)
          fi
          {
            if [ "$RELEASE" != "true" ]; then
              echo "Test build: lighter compression, so the file is a bit larger."
              echo
            fi
            echo "Eaglercraft 26.2 with these Fabric mods built in (from ${GITHUB_SHA::7}):"
            echo
            find mods -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort | sed 's/^/- /'
            if compgen -G "addons/*.js" >/dev/null; then
              echo
              echo "Add-ons:"
              find addons -maxdepth 1 -type f -name '*.js' -printf '%f\n' | sort | sed 's/^/- /'
            fi
            if [ -s eml/mod-check.md ]; then
              echo
              sed 's/^## Mod check$/### Mod check/' eml/mod-check.md
            fi
            if [ -s out/turned-off-injectors.txt ]; then
              echo
              echo "These mod injections don't fit Eaglercraft's version of the game and were turned off:"
              echo
              sed 's/^/- /' out/turned-off-injectors.txt
            fi
          } > notes.md
          gh release create "$tag" out/eaglercraft-26.2-modded.html \
            --title "$title" --notes-file notes.md "${kind[@]}"

      - name: Upload successful build for cache integration
        if: ${{ success() && inputs.cache_key != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: flick-${{ inputs.cache_key }}
          path: out/eaglercraft-26.2-modded.html
          if-no-files-found: error
          retention-days: 14
