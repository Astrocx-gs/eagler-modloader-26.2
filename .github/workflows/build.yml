name: Build Eaglercraft 26.2

# Builds Eaglercraft 26.2 with the Fabric mods in mods/ built in, as one standalone HTML file.
# loader/weave.sh hooks build-time Fabric into the workspace's Gradle build; see the README.
#
# Test builds (every push that changes mods/ or loader/, and manual runs): faster, lighter compression,
# readable names in crash reports, published as a pre-release. Release builds (push a tag like v1.0, or a manual run with "release"
# ticked): maximum compression, published as a normal release.
#
# TeaVM patching: the pinned workspace ships unpatched TeaVM jars. Every run copies them to
# teavm-pristine/, patches a scratch copy, checks the result, and only then installs it into the
# workspace. The *pristine* jars are cached; a patched jar is never cached or reused.

on:
  push:
    branches: [main]
    paths:
      - "mods/**"
      - "loader/**"
      - "addons/**"
      - "tools/**"
      - ".github/workflows/build.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release build (maximum compression, published as a normal release)"
        type: boolean
        default: false
      diagnostic:
        description: "Diagnostic build (readable names in crash reports; published as a draft only you can see)"
        type: boolean
        default: false
      mod_urls:
        description: "Comma-separated Modrinth/direct JAR URLs to add to mods/ (optional)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  # The Eaglercraft 26.2 workspace is downloaded at build time and never committed here.
  WORKSPACE_REPO: https://github.com/kingjoeishere/Eaglercraft-26.2-Workspace
  WORKSPACE_COMMIT: f73bff91f0f0840bc958c09ab536dbba1e146b2e
  # The three TeaVM core classes the patcher rewrites.
  TEAVM_CORE_CLASSES: >-
    org/teavm/model/transformation/NullCheckInsertion.class
    org/teavm/vm/TeaVM.class
    org/teavm/dependency/ReferenceResolver.class
  # The four TeaVM classlib classes; patched copies go into classlib-override.jar.
  TEAVM_CLASSLIB_CLASSES: >-
    org/teavm/classlib/java/lang/reflect/TConstructor.class
    org/teavm/classlib/java/lang/reflect/TMethod.class
    org/teavm/classlib/java/nio/file/TFiles.class
    org/teavm/classlib/java/nio/charset/TCharset.class
  PATCH_JAR: workspace/wasm-toolchain/teavm-eagler-patch/teavm-core-0.13.1-eagler.jar
  OVERRIDE_JAR: workspace/wasm-toolchain/teavm-eagler-patch/classlib-override.jar

jobs:
  build:
    runs-on: ubuntu-latest   # public repos: 4 cores, 16 GB RAM
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - name: Download the Eaglercraft 26.2 workspace
        run: |
          set -euo pipefail
          git init -q workspace
          cd workspace
          git remote add origin "$WORKSPACE_REPO"
          git fetch -q --depth 1 origin "$WORKSPACE_COMMIT"
          git checkout -q FETCH_HEAD
          chmod +x gradlew
          # Gradle itself is downloaded on first use; retry, then fail explicitly
          ok=0
          for i in 1 2 3 4 5; do
            if ./gradlew --no-daemon --version >/dev/null; then ok=1; break; fi
            echo "Gradle download failed (try $i)"
            sleep $((i * 20))
          done
          if [ "$ok" -ne 1 ]; then
            echo "ERROR: Gradle could not be downloaded after 5 attempts" >&2
            exit 1
          fi
          ./gradlew --no-daemon --version | head -5

      # Only the unpatched TeaVM jars are cached, keyed by the pinned workspace commit. The workspace
      # itself is a shallow clone of one commit (seconds) and is never cached, so a run can never
      # inherit a patched jar from a previous one.
      - name: Cache pristine TeaVM jars
        uses: actions/cache@v4
        with:
          path: |
            teavm-pristine/teavm-core-0.13.1-eagler.jar
            teavm-pristine/classlib-override.jar
            teavm-pristine/teavm-classlib-0.13.1.jar
          key: teavm-pristine-${{ env.WORKSPACE_COMMIT }}

      # A cache entry is only trusted after it is compared, byte for byte, with the pinned workspace.
      - name: Prepare and verify pristine TeaVM jars
        run: |
          set -euo pipefail
          mkdir -p teavm-pristine
          WS_DIR="workspace/wasm-toolchain/teavm-eagler-patch"
          for j in teavm-core-0.13.1-eagler.jar classlib-override.jar; do
            ws_sha="$(sha256sum "$WS_DIR/$j" | awk '{print $1}')"
            if [ -s "teavm-pristine/$j" ]; then
              cache_sha="$(sha256sum "teavm-pristine/$j" | awk '{print $1}')"
              if [ "$cache_sha" != "$ws_sha" ]; then
                echo "[pristine] cached $j (${cache_sha:0:16}) does not match the pinned workspace (${ws_sha:0:16}); refreshing"
                cp -f "$WS_DIR/$j" "teavm-pristine/$j"
              fi
            else
              cp -f "$WS_DIR/$j" "teavm-pristine/$j"
            fi
            # a truncated or otherwise wrong cache entry never reaches the patcher: the
            # checksum comparison above replaces anything that differs from the pinned workspace
            jar tf "teavm-pristine/$j" > /dev/null
          done
          # the stock classlib the classlib patches are taken from
          if [ ! -s teavm-pristine/teavm-classlib-0.13.1.jar ]; then
            curl -fsSL --retry 5 -o teavm-pristine/teavm-classlib-0.13.1.jar \
              https://repo1.maven.org/maven2/org/teavm/teavm-classlib/0.13.1/teavm-classlib-0.13.1.jar
          fi
          jar tf teavm-pristine/teavm-classlib-0.13.1.jar > /dev/null
          echo "[pristine] verified:"
          for j in teavm-pristine/*.jar; do
            printf '  %-46s %s  %s\n' "$(basename "$j")" "$(sha256sum "$j" | cut -c1-16)" "$(stat -c%s "$j") bytes"
          done

      - name: Download the mods listed in mods/modrinth.txt
        env:
          MOD_URLS: ${{ inputs.mod_urls }}
        run: |
          set -euo pipefail
          if [ -f mods/modrinth.txt ]; then python3 tools/modrinth.py download 26.2 mods/modrinth.txt mods; fi
          # user-supplied extra jars; MOD_URLS arrives through the environment, never spliced into shell source
          if [ -n "${MOD_URLS:-}" ]; then
            IFS=',' read -r -a urls <<< "$MOD_URLS"
            for u in "${urls[@]}"; do
              u="${u#"${u%%[![:space:]]*}"}"
              [ -z "$u" ] && continue
              case "$u" in https://*) ;; *) echo "ERROR: not an https URL: $u" >&2; exit 1 ;; esac
              name="${u##*/}"
              case "$name" in *.jar) ;; *) echo "ERROR: URL does not end in .jar: $u" >&2; exit 1 ;; esac
              echo "fetching $u"
              curl -fSL --retry 3 -o "mods/$name" "$u"
            done
          fi
          ls -la mods

      # Quick checks first, so a mod that can't work stops the build in minutes instead of after the
      # long browser compile.
      - name: "Check the mods: can each jar be built in? (seconds)"
        run: |
          mkdir -p eml
          python3 loader/scan-mods.py mods eml/mod-check.md workspace || { cat eml/mod-check.md >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          cat eml/mod-check.md >> "$GITHUB_STEP_SUMMARY"

      - name: Set up build-time Fabric
        run: chmod +x loader/weave.sh && loader/weave.sh workspace eml

      - name: "Check the mods: apply them to the game (a few minutes)"
        working-directory: workspace
        run: ./gradlew --no-daemon --console=plain :game:compileJava

      - name: Explain a failed mod check
        if: failure()
        run: |
          {
            echo "## Why the build stopped"; echo
            if [ -f eml/weave.log ]; then
              echo "Applying the mods to the game failed. The important part of the log:"; echo; echo '```'
              grep -E "Incompatible|requires|Mod resolution|Unhandled|Caused by|Exception|ERROR|error:" eml/weave.log | head -40
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space and add swap
        run: |
          if sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; then
            echo "[disk] removed unused toolchains"
          else
            echo "[disk] nothing to remove (non-fatal housekeeping)"
          fi
          if sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2 &&
             sudo mkswap /swapfile2 && sudo swapon /swapfile2; then
            echo "[disk] 8G swap enabled"
          else
            echo "[disk] swap not added (non-fatal housekeeping)"
          fi
          free -h; df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Game sounds from Mojang (not in the workspace)
        run: |
          python3 loader/fetch-sounds.py 26.2 eml/sounds eml/music
          cd workspace
          mkdir -p target_teavm/build/web
          # the workspace's own EPK packager, run the way its assets.epk task runs it (desktop platform)
          cat > ../eml/epk.init.gradle <<'EOF2'
          allprojects {
            afterEvaluate { p ->
              if (p.path != ":target_lwjgl_desktop") return
              ["sounds", "music"].each { n ->
                p.tasks.register("emlPack_" + n, JavaExec) {
                  classpath = p.sourceSets.main.runtimeClasspath
                  mainClass = "net.lax1dude.eaglercraft.v1_8.sp.server.export.EPKPackagerMain"
                  args(new File(p.rootDir, "../eml/" + n).absolutePath,
                       new File(p.rootDir, "target_teavm/build/web/" + n + ".epk").absolutePath,
                       n + ".epk", "--include-web-unreachable")
                }
              }
            }
          }
          EOF2
          ./gradlew --no-daemon --console=plain -I ../eml/epk.init.gradle :target_lwjgl_desktop:emlPack_sounds :target_lwjgl_desktop:emlPack_music
          ls -la target_teavm/build/web/

      # ---------------------------------------------------------------- patching
      # Uses the pristine copies only. Classes are extracted, patched and re-inserted from the same
      # directory, and every path is passed as its own argument.
      - name: Patch TeaVM for mods (null checks, missing classes, reflection, Files.createDirectories, UTF8)
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/patch-teavm"
          rm -rf "$WORK"; mkdir -p "$WORK/classes" "$WORK/x"
          DEPS="$(ls "$PWD"/eml/deps/*.jar | tr '\n' ':')"
          [ -n "$DEPS" ] || { echo "ERROR: eml/deps is empty; loader/weave.sh did not populate it" >&2; exit 1; }

          # 1. the patcher itself
          javac -nowarn -cp "$DEPS" -d "$WORK/classes" loader/tools/PatchTeaVM.java

          read -r -a CORE <<< "$TEAVM_CORE_CLASSES"
          read -r -a CLS <<< "$TEAVM_CLASSLIB_CLASSES"

          # 2. core jar: extract -> patch -> re-insert, all relative to $WORK/x
          cp -f teavm-pristine/teavm-core-0.13.1-eagler.jar "$WORK/core.jar"
          unzip -o -q "$WORK/core.jar" "${CORE[@]}" -d "$WORK/x"
          ( cd "$WORK" && java -cp "$DEPS:$WORK/classes" PatchTeaVM "${CORE[@]/#/x/}" )
          # jar -C applies to the next entry only, so insert from inside the extraction directory
          ( cd "$WORK/x" && jar uf "$WORK/core.jar" "${CORE[@]}" )

          # 3. classlib: same, into a copy of the override jar
          cp -f teavm-pristine/classlib-override.jar "$WORK/override.jar"
          unzip -o -q teavm-pristine/teavm-classlib-0.13.1.jar "${CLS[@]}" -d "$WORK/x"
          ( cd "$WORK" && java -cp "$DEPS:$WORK/classes" PatchTeaVM "${CLS[@]/#/x/}" )
          ( cd "$WORK/x" && jar uf "$WORK/override.jar" "${CLS[@]}" )

          # 4. every expected class exactly once, wrapper methods present exactly once
          jar tf "$WORK/core.jar" > "$WORK/core.list"
          jar tf "$WORK/override.jar" > "$WORK/override.list"
          for c in "${CORE[@]}"; do
            n="$(grep -c -F -x "$c" "$WORK/core.list")"
            [ "$n" -eq 1 ] || { echo "ERROR: $c appears $n times in the patched core jar (want 1)" >&2; exit 1; }
          done
          for c in "${CLS[@]}"; do
            n="$(grep -c -F -x "$c" "$WORK/override.list")"
            [ "$n" -eq 1 ] || { echo "ERROR: $c appears $n times in classlib-override.jar (want 1)" >&2; exit 1; }
          done
          [ "$(javap -cp "$WORK/core.jar" -p -s org.teavm.vm.TeaVM | grep -c 'optimizeMethodCacheMiss\$orig(')" -eq 1 ]
          [ "$(javap -cp "$WORK/core.jar" -p -s org.teavm.vm.TeaVM | grep -c 'optimizeMethodCacheMiss(')" -eq 1 ]
          [ "$(javap -cp "$WORK/core.jar" -p -s org.teavm.model.transformation.NullCheckInsertion | grep -c 'transformProgram\$orig(')" -eq 1 ]
          [ "$(javap -cp "$WORK/core.jar" -p -s org.teavm.model.transformation.NullCheckInsertion | grep -c 'transformProgram(')" -eq 1 ]
          javap -cp "$WORK/core.jar" -p -c org.teavm.dependency.ReferenceResolver | grep -q 'org/teavm/diagnostics/Diagnostics.warning'
          javap -cp "$WORK/override.jar" -p -s org.teavm.classlib.java.nio.charset.TCharset | grep -q 'forName'

          # 5. stage for the verification step; nothing is installed yet
          mkdir -p eml/patched
          cp -f "$WORK/core.jar" eml/patched/teavm-core-0.13.1-eagler.jar
          cp -f "$WORK/override.jar" eml/patched/classlib-override.jar
          echo "[patch-teavm] staged in eml/patched"

      # The patcher must be a no-op on its own output: two passes over all three core classes, then
      # every class must be byte-identical. A patcher that re-wraps adds duplicate methods and the
      # resulting class is not loadable.
      - name: PatchTeaVM is idempotent on all three core classes
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/patch-idem"
          rm -rf "$WORK"; mkdir -p "$WORK/classes" "$WORK/x"
          DEPS="$(ls "$PWD"/eml/deps/*.jar | tr '\n' ':')"
          javac -nowarn -cp "$DEPS" -d "$WORK/classes" loader/tools/PatchTeaVM.java
          read -r -a CORE <<< "$TEAVM_CORE_CLASSES"

          # a pristine copy, so this step tests the patcher and not the staged output
          cp -f teavm-pristine/teavm-core-0.13.1-eagler.jar "$WORK/core.jar"
          unzip -o -q "$WORK/core.jar" "${CORE[@]}" -d "$WORK/x"
          mkdir -p "$WORK/pass1" "$WORK/pass2"

          echo "=== pass 1 (pristine -> patched) ==="
          ( cd "$WORK/x" && java -cp "$DEPS:$WORK/classes" PatchTeaVM "${CORE[@]}" )
          for c in "${CORE[@]}"; do
            mkdir -p "$WORK/pass1/$(dirname "$c")"
            cp "$WORK/x/$c" "$WORK/pass1/$c"
          done

          echo "=== pass 2 (already patched -> must be a no-op) ==="
          ( cd "$WORK/x" && java -cp "$DEPS:$WORK/classes" PatchTeaVM "${CORE[@]}" )
          for c in "${CORE[@]}"; do
            mkdir -p "$WORK/pass2/$(dirname "$c")"
            cp "$WORK/x/$c" "$WORK/pass2/$c"
          done

          for c in "${CORE[@]}"; do
            if cmp -s "$WORK/pass1/$c" "$WORK/pass2/$c"; then
              echo "[idem] $c unchanged by the second pass"
            else
              echo "ERROR: $c changed on the second patch pass; PatchTeaVM is not idempotent" >&2
              exit 1
            fi
          done
          # and no duplicated wrapper methods crept in
          [ "$(javap -cp "$WORK/x" -p -s org.teavm.vm.TeaVM | grep -c 'optimizeMethodCacheMiss\$orig(')" -eq 1 ]
          [ "$(javap -cp "$WORK/x" -p -s org.teavm.model.transformation.NullCheckInsertion | grep -c 'transformProgram\$orig(')" -eq 1 ]

      # Installs the staged jars, then proves the class TeaVM will actually load is the patched one.
      - name: Verify patched TeaVM JAR, install it, and check the runtime classpath
        run: |
          set -euo pipefail
          STAGED_CORE="eml/patched/teavm-core-0.13.1-eagler.jar"
          STAGED_OVER="eml/patched/classlib-override.jar"
          test -s "$STAGED_CORE"; test -s "$STAGED_OVER"

          # entry hashes of the staged jar, taken before anything is installed
          unzip -p "$STAGED_CORE" org/teavm/vm/TeaVM.class > "$RUNNER_TEMP/staged-TeaVM.class"
          EXPECTED_SHA="$(sha256sum "$RUNNER_TEMP/staged-TeaVM.class" | awk '{print $1}')"
          echo "[verify] staged TeaVM.class sha256: $EXPECTED_SHA"

          # atomic install
          cp -f "$STAGED_CORE" "$PATCH_JAR.new"
          cp -f "$STAGED_OVER" "$OVERRIDE_JAR.new"
          mv -f "$PATCH_JAR.new" "$PATCH_JAR"
          mv -f "$OVERRIDE_JAR.new" "$OVERRIDE_JAR"
          echo "[verify] installed patched jars into workspace/wasm-toolchain/teavm-eagler-patch/"
          sha256sum "$PATCH_JAR" "$OVERRIDE_JAR"

          # the tool classpath, from the workspace's own task. It prints one line prefixed with
          # EAGLER_STANDALONE_CLASSPATHS= whose value is JSON, so the prefix has to be stripped.
          RAW="$(cd workspace && ./gradlew --no-daemon -q :target_teavm_wasm_gc:printStandaloneClasspaths)"
          JSON="$(printf '%s\n' "$RAW" | sed -n 's/^EAGLER_STANDALONE_CLASSPATHS=//p')"
          if [ -z "$JSON" ]; then
            echo "ERROR: :target_teavm_wasm_gc:printStandaloneClasspaths printed no EAGLER_STANDALONE_CLASSPATHS line" >&2
            printf '%s\n' "$RAW" >&2
            exit 1
          fi
          TOOL_CP="$(printf '%s' "$JSON" | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
            process.stdout.write(d.tool.join(":"));
          ')"
          echo "[verify] tool classpath entries: $(printf '%s' "$TOOL_CP" | tr ':' '\n' | wc -l)"

          mkdir -p "$RUNNER_TEMP/rt"
          cat > "$RUNNER_TEMP/rt/CheckTeaVMRuntime.java" <<'EOFJ'
          import java.io.InputStream;
          import java.net.URL;
          import java.net.URLDecoder;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Path;
          import java.security.MessageDigest;

          public class CheckTeaVMRuntime {
            public static void main(String[] args) throws Exception {
              String expectedSha = args[0];
              String patchedJar = args[1];
              URL res = CheckTeaVMRuntime.class.getClassLoader().getResource("org/teavm/vm/TeaVM.class");
              System.out.println("[verify] runtime resource: " + res);
              if (res == null) throw new IllegalStateException("org/teavm/vm/TeaVM.class not on the tool classpath");
              // the resource is a jar:file:/...!/ URL: canonicalise both sides so symlinks and
              // /private/var-style prefixes cannot produce a false mismatch
              String from = URLDecoder.decode(res.toString(), StandardCharsets.UTF_8);
              String jarPath = from;
              if (jarPath.startsWith("jar:")) jarPath = jarPath.substring(4);
              if (jarPath.startsWith("file:")) jarPath = jarPath.substring(5);
              int bang = jarPath.indexOf("!/");
              if (bang >= 0) jarPath = jarPath.substring(0, bang);
              String fromCanon = new java.io.File(jarPath).getCanonicalPath();
              String patchedCanon = new java.io.File(patchedJar).getCanonicalPath();
              if (!fromCanon.equals(patchedCanon))
                throw new IllegalStateException("TeaVM.class is loaded from " + fromCanon + ", not the patched jar " + patchedCanon);
              System.out.println("[verify] loaded from the patched jar: " + fromCanon);
              byte[] bytes;
              try (InputStream in = res.openStream()) { bytes = in.readAllBytes(); }
              StringBuilder sb = new StringBuilder();
              for (byte b : MessageDigest.getInstance("SHA-256").digest(bytes)) sb.append(String.format("%02x", b));
              String actual = sb.toString();
              System.out.println("[verify] runtime TeaVM.class sha256: " + actual);
              if (!expectedSha.equals(actual))
                throw new IllegalStateException("sha256 mismatch: expected " + expectedSha + " actual " + actual);
              Class<?> c = Class.forName("org.teavm.vm.TeaVM");
              System.out.println("[verify] OK " + c.getName() + " (" + c.getDeclaredMethods().length + " methods)");
            }
          }
          EOFJ
          javac -d "$RUNNER_TEMP/rt" "$RUNNER_TEMP/rt/CheckTeaVMRuntime.java"
          # the patched jar first, so it wins over any stock teavm-core on the tool classpath
          java -Xverify:all -cp "$PWD/$PATCH_JAR:$TOOL_CP:$RUNNER_TEMP/rt" \
            CheckTeaVMRuntime "$EXPECTED_SHA" "$PWD/$PATCH_JAR"

      - name: Pre-link sanity check
        run: |
          set -euo pipefail
          for f in workspace/wasm-toolchain/build-single-html.js "$PATCH_JAR" "$OVERRIDE_JAR"; do
            [ -f "$f" ] || { echo "[pre-link] FAIL: missing $f" >&2; exit 1; }
            echo "[pre-link] PASS: $f"
          done
          jar tf "$OVERRIDE_JAR" | grep -F -x "org/teavm/classlib/java/nio/charset/TCharset.class" > /dev/null
          echo "[pre-link] PASS: classlib-override.jar carries the patched classlib classes"

      - name: Build the standalone HTML
        working-directory: workspace
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
          # test builds keep readable names in crash reports; releases don't
          DIAGNOSTIC: ${{ inputs.diagnostic == true || !(startsWith(github.ref, 'refs/tags/v') || inputs.release == true) }}
          EAGLER_BUILD_CAP_MIB: "13312"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          set -euo pipefail
          mkdir -p ../out
          npm install --no-audit --no-fund
          if [ "$RELEASE" = "true" ]; then FAST=""; else FAST="--fast-package"; fi
          if [ "$DIAGNOSTIC" = "true" ]; then
            FAST="$FAST --diagnostic"
            # also keep readable names in the singleplayer server worker's crash reports
            export EAGLER_SERVER_DIAGNOSTIC=1
            # the workspace only installs a named server build for local debugging; install it here too
            sed -i 's/^  if (diagnostic) {$/  if (false) {/' wasm-toolchain/link-server-standalone.js
            grep -q '^  if (false) {$' wasm-toolchain/link-server-standalone.js
          fi
          node wasm-toolchain/build-single-html.js $FAST --output ../out/eaglercraft-26.2-modded.html
          python3 ../loader/inject-addons.py ../addons ../out/eaglercraft-26.2-modded.html
          [ -s ../out/eaglercraft-26.2-modded.html ] || { echo "ERROR: out/eaglercraft-26.2-modded.html is missing or empty" >&2; exit 1; }
          ls -la ../out/
          if [ -f ../eml/disabled-injectors.txt ]; then
            awk '!/^#/' ../eml/disabled-injectors.txt > ../out/turned-off-injectors.txt
          else
            echo "[injectors] eml/disabled-injectors.txt not present; nothing was turned off"
            : > ../out/turned-off-injectors.txt
          fi

      - name: Capture TeaVM linker diagnostic on failure
        if: failure()
        run: |
          LOG="workspace/wasm-toolchain/generated/client-precise-link.log"
          if [ -f "$LOG" ]; then
            echo "=== Last 180 lines of $LOG ==="
            tail -n 180 "$LOG"
            if hits=$(grep -n -C 8 -E "ERROR|Exception|AssertionError|ClassCastException|Caused by:" "$LOG" | tail -n 120); then
              printf '%s\n' "$hits"
            else
              echo "(no ERROR/Exception lines)"
            fi
          else
            echo "Diagnostic log not found at $LOG"
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-modded
          path: |
            out/
            eml/weave.log
            eml/gen.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
          DIAGNOSTIC: ${{ inputs.diagnostic == true }}
        run: |
          set -euo pipefail
          if [ "$DIAGNOSTIC" = "true" ]; then
            tag="diag-${GITHUB_RUN_NUMBER}"; title="Diagnostic build ${GITHUB_RUN_NUMBER}"; kind=(--draft)
          elif [ "$RELEASE" = "true" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF_NAME}"; else tag="release-${GITHUB_RUN_NUMBER}"; fi
            title="$tag"; kind=(--latest)
          else
            tag="test-${GITHUB_RUN_NUMBER}"; title="Test build ${GITHUB_RUN_NUMBER}"; kind=(--prerelease)
          fi
          {
            if [ "$RELEASE" != "true" ]; then echo "Test build: lighter compression, so the file is a bit larger."; echo; fi
            echo "Eaglercraft 26.2 with these Fabric mods built in (from ${GITHUB_SHA::7}):"
            echo; ls mods | grep '\.jar$' | sed 's/^/- /'
            if ls addons/*.js >/dev/null 2>&1; then echo; echo "Add-ons:"; echo; ls addons/*.js | xargs -n1 basename | sed 's/^/- /'; fi
            if [ -s eml/mod-check.md ]; then echo; sed 's/^## Mod check$/### Mod check/' eml/mod-check.md; fi
            if [ -s out/turned-off-injectors.txt ]; then
              echo; echo "These mod injections don't fit Eaglercraft's version of the game and were turned off:"
              echo; sed 's/^/- /' out/turned-off-injectors.txt
            fi
          } > notes.md
          gh release create "$tag" out/*.html --title "$title" --notes-file notes.md "${kind[@]}"
