name: Diagnose ReferenceResolver Bytecode

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Shallow clone Eaglercraft 26.2 workspace
        run: |
          git init -q workspace
          cd workspace
          git remote add origin https://github.com/kingjoeishere/Eaglercraft-26.2-Workspace
          git fetch -q --depth 1 origin f73bff91f0f0840bc958c09ab536dbba1e146b2e
          git checkout -q FETCH_HEAD

      - name: Disassemble ReferenceResolver.reportError
        run: |
          set -euo pipefail
          JAR="$(ls workspace/wasm-toolchain/teavm-eagler-patch/teavm-core-*.jar | head -1)"
          echo "=== TeaVM JAR: $JAR ==="
          test -f "$JAR"
          jar tf "$JAR" | grep -F -x "org/teavm/dependency/ReferenceResolver.class"
          echo "=== Complete reportError method (javap -p -c -s) ==="
          javap -cp "$JAR" -p -c -s org.teavm.dependency.ReferenceResolver | awk '
            /reportError/ { in_m=1 }
            in_m { print }
            in_m && /^$/ { exit }
          '
